name: Report a bug
description: Something does not work as expected.
labels: [bug]
body:
  - type: dropdown
    id: mc
    attributes:
      label: Minecraft version
      options: ["26.3", "26.2", "Rust version", "Older"]
    validations:
      required: true
  - type: input
    id: mod
    attributes:
      label: Mod version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
