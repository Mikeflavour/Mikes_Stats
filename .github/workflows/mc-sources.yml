name: mc-sources

# Manual: decompiles Minecraft so the source can be looked up while coding.
on:
  workflow_dispatch:

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew genSources --stacktrace
      - run: |
          mkdir out
          find ~/.gradle .gradle -name '*sources*.jar' \( -path '*minecraft*' -o -path '*fabric-api*' -o -path '*fabric*' \) -exec cp {} out/ \; 2>/dev/null || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mc-sources
          path: out/
